# This file has to stay on the default branch: GitHub registers `schedule` and
# `workflow_dispatch` only from there, so a copy on a side branch never fires.
# It is fork-only (no counterpart upstream), so syncing JabRef/jabref into main
# must merge rather than force-push - a forced sync silently drops this file and
# the hourly runs stop without any failure to notice.
name: Update experimental

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # Editing the branch list below re-merges right away instead of waiting for the next hourly run.
      - .github/workflows/update-experimental.yml

permissions:
  contents: write

env:
  TARGET: experimental
  # Remote names mirror a local JabRef checkout: origin = JabRef/jabref, koppor = JabRef/jabref-koppor.
  # Branches without a PR.
  BRANCHES: |
    origin/main
    koppor/directory-mapping-preference
  # Pull requests (JabRef/jabref or JabRef/jabref-koppor); the head branch of each open PR is merged, closed ones are skipped.
  PRS: |
    https://github.com/JabRef/jabref/pull/16124
    https://github.com/JabRef/jabref-koppor/pull/760
    https://github.com/JabRef/jabref/pull/17104
    https://github.com/JabRef/jabref-koppor/pull/768
    https://github.com/JabRef/jabref/pull/17145
    https://github.com/JabRef/jabref/pull/17146
    https://github.com/JabRef/jabref/pull/17135
    https://github.com/JabRef/jabref/pull/17144

jobs:
  merge:
    if: github.repository == 'JabRef/jabref-koppor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # PAT with `workflows` scope: the default GITHUB_TOKEN cannot push
          # merges that touch .github/workflows/* (e.g. upstream main editing a
          # workflow file), which makes the final push fail.
          token: ${{ secrets.UPDATE_EXPERIMENTAL|| github.token }}

      - name: Merge branches into ${{ env.TARGET }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote rename origin koppor
          git remote add origin https://github.com/JabRef/jabref.git
          git fetch --no-tags --prune origin
          git fetch --no-tags --prune koppor

          if git rev-parse -q --verify "koppor/$TARGET^{commit}" > /dev/null; then
            git checkout -B "$TARGET" "koppor/$TARGET"
          else
            git checkout -B "$TARGET" origin/main
          fi

          merge() {
            if git merge --no-edit -m "Merge $2 into $TARGET" "$1"; then
              echo "- :white_check_mark: \`$2\` ${3:-}" >> "$GITHUB_STEP_SUMMARY"
            else
              git merge --abort
              echo "::warning::Merge conflict for $2 - skipped"
              echo "- :x: \`$2\` ${3:-} - merge conflict, skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          while read -r branch; do
            branch="${branch%%#*}"
            branch="$(echo "$branch" | xargs)"
            [ -n "$branch" ] || continue
            if ! git rev-parse -q --verify "$branch^{commit}" > /dev/null; then
              echo "::warning::Branch $branch does not exist (any more) - skipped"
              echo "- :warning: \`$branch\` - gone, skipped" >> "$GITHUB_STEP_SUMMARY"
            else
              merge "$branch" "$branch"
            fi
          done <<< "$BRANCHES"

          while read -r pr; do
            pr="${pr%%#*}"
            pr="$(echo "$pr" | xargs)"
            [ -n "$pr" ] || continue
            # Fork PRs have no branch in origin/koppor; resolve owner:branch via the API and fetch the PR ref.
            if ! info="$(gh pr view "$pr" --json state,headRepositoryOwner,headRefName --jq '"\(.state) \(.headRepositoryOwner.login):\(.headRefName)"')"; then
              echo "::warning::PR $pr not found - skipped"
              echo "- :warning: $pr - not found, skipped" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            read -r state branch <<< "$info"
            if [ "$state" != OPEN ]; then
              echo "- :warning: \`$branch\` ($pr) - $state, skipped" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            repo="${pr%/pull/*}"
            git fetch --no-tags "$repo.git" "refs/pull/${pr##*/}/head"
            merge FETCH_HEAD "$branch" "($pr)"
          done <<< "$PRS"

          git push koppor "HEAD:refs/heads/$TARGET"
