# This file has to stay on the default branch: GitHub registers `schedule` and
# `workflow_dispatch` only from there, so a copy on a side branch never fires.
# It is fork-only (no counterpart upstream), so syncing JabRef/jabref into main
# must merge rather than force-push - a forced sync silently drops this file and
# the hourly runs stop without any failure to notice.
name: Update experimental

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # Editing the branch list below re-merges right away instead of waiting for the next hourly run.
      - .github/workflows/update-experimental.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  # A run compiles after every merge and can outlast the hour; cancelling would never let one finish.
  cancel-in-progress: false

env:
  TARGET: experimental
  # Remote names mirror a local JabRef checkout: origin = JabRef/jabref, koppor = JabRef/jabref-koppor.
  # Branches without a PR.
  BRANCHES: |
    origin/main
    koppor/directory-mapping-preference
  # Pull requests (JabRef/jabref or JabRef/jabref-koppor); the head branch of each open PR is merged, closed ones are skipped.
  # Non-draft PRs with their branch in JabRef/jabref are merged automatically; list only fork PRs, koppor PRs, and drafts here.
  PRS: |
    https://github.com/JabRef/jabref-koppor/pull/760
    https://github.com/JabRef/jabref-koppor/pull/768
    https://github.com/JabRef/jabref/pull/17134

jobs:
  merge:
    if: github.repository == 'JabRef/jabref-koppor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # PAT with `workflows` scope: the default GITHUB_TOKEN cannot push
          # merges that touch .github/workflows/* (e.g. upstream main editing a
          # workflow file), which makes the final push fail.
          token: ${{ secrets.UPDATE_EXPERIMENTAL|| github.token }}
          submodules: 'true'
      - uses: ./.github/actions/setup-gradle

      - name: Merge branches into ${{ env.TARGET }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote rename origin koppor
          git remote add origin https://github.com/JabRef/jabref.git
          git fetch --no-tags --prune origin
          git fetch --no-tags --prune koppor

          if git rev-parse -q --verify "koppor/$TARGET^{commit}" > /dev/null; then
            git checkout -B "$TARGET" "koppor/$TARGET"
          else
            git checkout -B "$TARGET" origin/main
          fi

          compiles() {
            git submodule update --init --quiet
            gradle --quiet compileJava
          }

          # A merge that breaks compilation is undone. While experimental itself does not compile, merges are kept,
          # so a fix can still come in.
          green=false
          compiles && green=true

          push() {
            git push --quiet koppor "HEAD:refs/heads/$TARGET"
          }

          merge() {
            if git merge --no-edit -m "Merge $2 into $TARGET" "$1"; then
              if compiles; then
                green=true
                push
                echo "- :white_check_mark: \`$2\` ${3:-}" >> "$GITHUB_STEP_SUMMARY"
              elif [ "$green" = true ]; then
                git reset --hard --quiet ORIG_HEAD
                echo "::warning::Compile error after merging $2 - skipped"
                echo "- :x: \`$2\` ${3:-} - compile error, skipped" >> "$GITHUB_STEP_SUMMARY"
              else
                push
                echo "::warning::$TARGET does not compile (kept merge of $2)"
                echo "- :warning: \`$2\` ${3:-} - merged, $TARGET does not compile" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              git merge --abort
              echo "::warning::Merge conflict for $2 - skipped"
              echo "- :x: \`$2\` ${3:-} - merge conflict, skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          # A PR squash-merged into main is already in experimental as its branch; merging the squash re-applies
          # the change and conflicts with whatever experimental built on top. The magic merge commit (tree of the
          # squash, parents PR head + squash) tells git both are the same change. Used only when the squash equals
          # a clean merge of the PR head into its parent, so rebase merges and edited squashes take the normal path.
          for squash in $(git rev-list --reverse --first-parent HEAD..origin/main); do
            head="$(gh api "repos/JabRef/jabref/commits/$squash/pulls" --jq ".[] | select(.merge_commit_sha == \"$squash\") | .head.sha")" || continue
            [ -n "$head" ] && git merge-base --is-ancestor "$head" HEAD 2> /dev/null || continue
            [ "$(git merge-tree --write-tree "$squash^" "$head" 2> /dev/null)" = "$(git rev-parse "$squash^{tree}")" ] || continue
            merge "$squash^" "origin/main before $squash"
            magic="$(git commit-tree "$squash^{tree}" -p "$head" -p "$squash" -m "Magic merge commit for $squash")"
            merge "$magic" "squash $squash" "(magic merge commit)"
          done

          # Everything to merge: ref, label, and summary suffix per entry. Refs experimental already contains are dropped.
          refs=()
          labels=()
          suffixes=()
          candidate() {
            git merge-base --is-ancestor "$1" HEAD && return
            refs+=("$1")
            labels+=("$2")
            suffixes+=("${3:-}")
          }

          while read -r branch; do
            branch="${branch%%#*}"
            branch="$(echo "$branch" | xargs)"
            [ -n "$branch" ] || continue
            if ! git rev-parse -q --verify "$branch^{commit}" > /dev/null; then
              echo "::warning::Branch $branch does not exist (any more) - skipped"
              echo "- :warning: \`$branch\` - gone, skipped" >> "$GITHUB_STEP_SUMMARY"
            else
              candidate "$branch" "$branch"
            fi
          done <<< "$BRANCHES"

          # Append every non-draft JabRef/jabref PR whose branch lives in JabRef/jabref (no forks); drop duplicates.
          upstream_prs="$(gh pr list --repo JabRef/jabref --state open --limit 1000 --json url,isDraft,isCrossRepository \
            --jq '.[] | select((.isDraft or .isCrossRepository) | not) | .url')"
          PRS="$(printf '%s\n%s\n' "$PRS" "$upstream_prs" | awk '!seen[$0]++')"

          while read -r pr; do
            pr="${pr%%#*}"
            pr="$(echo "$pr" | xargs)"
            [ -n "$pr" ] || continue
            # Fork PRs have no branch in origin/koppor; resolve owner:branch via the API and fetch the PR ref.
            if ! info="$(gh pr view "$pr" --json state,headRepositoryOwner,headRefName --jq '"\(.state) \(.headRepositoryOwner.login):\(.headRefName)"')"; then
              echo "::warning::PR $pr not found - skipped"
              echo "- :warning: $pr - not found, skipped" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            read -r state branch <<< "$info"
            if [ "$state" != OPEN ]; then
              echo "- :warning: \`$branch\` ($pr) - $state, skipped" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            repo="${pr%/pull/*}"
            ref="refs/candidates/${#refs[@]}"
            git fetch --no-tags "$repo.git" "+refs/pull/${pr##*/}/head:$ref"
            candidate "$ref" "$branch" "($pr)"
          done <<< "$PRS"

          # One octopus commit of everything: merge each ref locally (ort handles experimental's criss-cross history,
          # git's octopus strategy does not), skip conflicts, then record the result with all merged refs as parents.
          # If that does not compile, merge one by one instead, compiling and pushing after each.
          start="$(git rev-parse HEAD)"
          clean=()
          for i in "${!refs[@]}"; do
            if git merge --quiet --no-edit "${refs[$i]}"; then
              clean+=("$i")
            else
              git merge --abort
              echo "::warning::Merge conflict for ${labels[$i]} - skipped"
              echo "- :x: \`${labels[$i]}\` ${suffixes[$i]} - merge conflict, skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "${#clean[@]}" -gt 1 ] && { compiles || [ "$green" = false ]; }; then
            parents=(-p "$start")
            message="Merge ${#clean[@]} branches into $TARGET"$'\n'
            for i in "${clean[@]}"; do
              parents+=(-p "${refs[$i]}")
              message+=$'\n'"${labels[$i]} ${suffixes[$i]}"
            done
            git reset --hard --quiet "$(git commit-tree "HEAD^{tree}" "${parents[@]}" -m "$message")"
            push
            for i in "${clean[@]}"; do
              echo "- :octopus: \`${labels[$i]}\` ${suffixes[$i]}" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            git reset --hard --quiet "$start"
            for i in "${clean[@]}"; do
              merge "${refs[$i]}" "${labels[$i]}" "${suffixes[$i]}"
            done
          fi
