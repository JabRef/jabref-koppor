name: Format Java sources
description: Reformat Java sources with open-java-format (https://openjavaformat.dev/), version from .open-java-format-version

runs:
  using: composite
  steps:
    - name: Download open-java-format
      shell: bash
      run: |
        version="$(cat .open-java-format-version)"
        binary=open-java-format-linux-glibc_x86-64
        dir="$RUNNER_TEMP/open-java-format"
        mkdir -p "$dir"
        cd "$dir"
        curl -fsSLO "https://github.com/openjavaformat/open-java-format/releases/download/$version/$binary"
        curl -fsSLO "https://github.com/openjavaformat/open-java-format/releases/download/$version/checksums_sha256.txt"
        sha256sum --ignore-missing -c checksums_sha256.txt
        chmod +x "$binary"
        echo "OJF=$dir/$binary" >> "$GITHUB_ENV"
    - name: Run open-java-format
      shell: bash
      # git ls-files does not list the content of submodules: vendored code is formatted in the repository it comes from
      run: git ls-files -z '*.java' | xargs -0 "$OJF" --replace
