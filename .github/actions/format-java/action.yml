name: Format Java sources
description: >-
  Reformat Java sources with jfmt (https://github.com/Netflix/jfmt) via the Gradle task `jfmt`.
  Requires a JDK and Gradle on the runner (see ./.github/actions/setup-gradle).

runs:
  using: composite
  steps:
    - name: Run jfmt
      shell: bash
      run: gradle jfmt
